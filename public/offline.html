<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · BookTracker</title>
    <style>
      /* Café au Lait by default; the saved theme is applied below */
      :root { --bg: #17100b; --surface: #2f2117; --text: #f4e9da; --muted: #b8a58f; --primary: #d08c4f; --on-primary: #1b120b; }
      :root[data-theme="enchanted"] { --bg: #130f1c; --surface: #271e36; --text: #efe7f7; --muted: #a99bbd; --primary: #c9a45c; }
      :root[data-theme="ocean"] { --bg: #0a1220; --surface: #17263d; --text: #e6eef8; --muted: #93a7c2; --primary: #5cc2c7; }
      :root[data-theme="botanical"] { --bg: #f3efe4; --surface: #fbf8f0; --text: #26301f; --muted: #6b7564; --primary: #4f7a4a; --on-primary: #fff; }
      :root[data-theme="sugar"] { --bg: #fbf1f3; --surface: #fffafb; --text: #231f33; --muted: #7a7088; --primary: #c2577a; --on-primary: #fff; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card { max-width: 380px; text-align: center; background: var(--surface); border-radius: 22px; padding: 36px 28px; }
      .icon { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 26px; margin: 18px 0 8px; }
      p { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 22px; }
      button {
        border: 0; border-radius: 12px; padding: 11px 22px; font: 600 14px inherit; cursor: pointer;
        background: var(--primary); color: var(--on-primary);
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem("booktracker-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Your library lives online, so BookTracker needs a connection to open it. Grab a cup of tea — it'll be right here when you're back.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Head back automatically once the connection returns
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
